solvers:
  - name: "PYTHON-Sudoku._solve_bruteforce"
    command: "python3 solvers/sudokusolver.py"

  - name: "PYTHON-Sudoku._solve_bruteforce_v2"
    command: "python3 solvers/sudokusolver.py"

  - name: "PYTHON-phbeck-sudokuSolver"
    command: "python3 solvers/phbeck/main.py"
  
  - name: "C-bruteforcer.c (with malloc)"
    build: "gcc -O3 solvers/bruteforcer.c -o solvers/bruteforcer.out"
    command: "./solvers/bruteforcer.out"

  - name: "C-bruteforcer.c (no malloc)"
    build: "gcc -O3 solvers/bruteforcer.c -o solvers/bruteforcer.out"
    command: "./solvers/bruteforcer.out"

  - name: "C-bruteforcer.c (different masks, Gemini)"
    build: "gcc -O3 solvers/bruteforcer.c -o solvers/bruteforcer.out"
    command: "./solvers/bruteforcer.out"

  - name: "Rust-smartsolver"
    cwd: "./solvers"
    build: "cargo build --release"
    command: "./solvers/target/debug/smartsolver"

sudokus:
  - easy: "data/sudoku0.txt"
  - easy: "data/sudoku1.txt"
  - medium: "data/sudoku2.txt"
  - medium: "data/sudoku3.txt"